<link rel="stylesheet" href="{{AssetBaseUrl}}/slideshowpure.css" />
{{UserSettingsStyle}}<script>
    // Admin config from the plugin, read by slideshowpure.js at startup as a trusted source.
    // -1 means "use the frontend default"; keys in "lock" ignore per-user overrides.
    window.MediaBarConfig = {{MediaBarConfig}};
</script>
<script defer src="{{AssetBaseUrl}}/slideshowpure.js"></script>
<script defer>
    // Fallback for frontends older than v6.0.0 (plugin 2.4.x), which don't read
    // window.MediaBarConfig themselves and expose no applyConfig(). Copies the
    // admin values straight onto CONFIG the way the old loader did.
    (function () {
        const timer = setInterval(function () {
            const api = window.slideshowPure;
            if (!api || !api.CONFIG) return;
            clearInterval(timer);
            if (typeof api.applyConfig === "function") return;

            const cfg = window.MediaBarConfig || {};
            for (const key in cfg) {
                if (key === "lock" || key === "ImageSvgs") continue;
                if (!(key in api.CONFIG)) continue;
                if (cfg[key] === -1) continue;
                api.CONFIG[key] = cfg[key];
            }
            const svgs = cfg.ImageSvgs || {};
            for (const rawKey in svgs) {
                const key = rawKey.charAt(0).toLowerCase() + rawKey.slice(1);
                if (svgs[rawKey] && api.CONFIG.IMAGE_SVG && key in api.CONFIG.IMAGE_SVG) {
                    api.CONFIG.IMAGE_SVG[key] = svgs[rawKey];
                }
            }
        }, 100);
    })();
</script>
